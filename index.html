<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Länder Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="menuBtn" onclick="openMenu()">☰</button>

    <div id="overlay">

        <div id="menuBox">

            <h1>🌍 Länder Quiz</h1>

            <div id="stepMode">

                <h2>Spielmodus wählen</h2>

                <button onclick="chooseMode('hauptstadt')">
                    🏙️ Hauptstadt
                </button>

                <button onclick="chooseMode('flagge')">
                    🏳️ Flaggen
                </button>

            </div>

            <div id="statsBox">
                <h2>Deine Statistiken</h2>

                <div class="streakCard">
                    🔥 Beste Streak:
                    <strong id="bestStreak">0</strong>
                </div>

                <div class="statsMode">
                    <h3>🏙️ Hauptstädte</h3>
                    <div id="capitalStats"></div>
                </div>

                <div class="statsMode">
                    <h3>🏳️ Flaggen</h3>
                    <div id="flagStats"></div>
                </div>

                <button id="resetStatsBtn" onclick="resetStats()">
                    Statistiken zurücksetzen
                </button>
            </div>

            <div id="achievementsBox">
                <h2>Erfolge</h2>
                <div id="achievementsList"></div>
            </div>

            <div id="weaknessBox">
                <h2>Meine Schwächen</h2>
                <div id="weaknessList"></div>

                <button onclick="startWeaknessQuiz()">
                    Schwächen üben
                </button>
            </div>

            <div id="stepContinent" style="display:none;">

                <h2>Kontinent wählen</h2>

                <button onclick="selectContinent('Europa')">
                    🇪🇺 Europa
                </button>

                <button onclick="selectContinent('Amerika')">
                    🌎 Amerika
                </button>

                <button onclick="selectContinent('Afrika')">
                    🌍 Afrika
                </button>

                <button onclick="selectContinent('AsienOzeanien')">
                    🌏 Asien + Ozeanien
                </button>

                <button onclick="selectContinent('Welt')">
                    🌐 Ganze Welt
                </button>

                <button onclick="goBack()">
                    Zurück
                </button>

            </div>

        </div>

    </div>

    <div class="container">

        <div id="playerProgress">
            <div id="levelInfo">
                <strong>Level <span id="playerLevel">1</span></strong>
                <span id="xpMissing">100 XP bis Level 2</span>
            </div>

            <div class="xpBar">
                <div id="xpFill"></div>
            </div>

            <div id="levelUpMessage"></div>
        </div>

        <div id="flagWrap">
            <img id="flag" src="" alt="Flagge">
        </div>

        <h2 id="country"></h2>

        <input
            type="text"
            id="answer"
            placeholder="Hauptstadt eingeben..."
        >

        <div id="choices" style="display:none;"></div>

        <button id="checkBtn" onclick="checkAnswer()">
            Prüfen
        </button>

        <button id="nextBtn" onclick="next()" style="display:none;">
            Weiter
        </button>

        <p id="result"></p>

        <div id="scoreContainer">
            Aktuelle Streak:
            <span id="score">0</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
