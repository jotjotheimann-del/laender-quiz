<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Länder Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ☰ Menü Button -->
    <button id="menuBtn" onclick="openMenu()">☰</button>


    <!-- 🌍 Overlay -->
    <div id="overlay">

        <div id="menuBox">

            <h1>🌍 Länder Quiz</h1>

            <button onclick="selectContinent('Europa')">
                🇪🇺 Europa
            </button>

            <button onclick="selectContinent('Amerika')">
                🌎 Amerika
            </button>

            <button onclick="selectContinent('Afrika')">
                🌍 Afrika
            </button>

            <button onclick="selectContinent('AsienOzeanien')">
                🌏 Asien + Ozeanien
            </button>

            <button onclick="selectContinent('Welt')">
                🌐 Ganze Welt
            </button>

        </div>

    </div>


    <!-- 🎮 Quiz -->
    <div class="container">

        <h2 id="country"></h2>

        <img id="flag" src="">

        <input
            type="text"
            id="answer"
            placeholder="Hauptstadt eingeben"
        >

        <button id="checkBtn" onclick="checkAnswer()">
            Prüfen
        </button>

        <button id="nextBtn" onclick="nextQuestion()">
            Weiter
        </button>

        <p id="result"></p>

        <p>
            Punkte: <span id="score">0</span>
        </p>
        

    </div>

    <script src="script.js"></script>

</body>
</html>
